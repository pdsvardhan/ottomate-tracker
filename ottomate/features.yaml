features:
  - id: feat-anti-gaslighting
    title: Anti-gaslighting bedrock (R1)
    short_description: Lock-in gate at 4.3 + verifier sub-agent + trace report — the
      highest-cardinality requirement
    status: done
    priority: P1
    size: L
    test_status: not-tested
    acceptance_criteria:
      - content: User reaching iteration in awaiting-lock state can edit/split/reject
          items before locking
        test_status: not-tested
        linked_test: null
      - content: Lock action 400s if any item has confidence < 0.7 AND user_edited=false
        test_status: not-tested
        linked_test: null
      - content: Trace report after integrate shows raw text, locked items, verifier
          verdicts side by side
        test_status: not-tested
        linked_test: null

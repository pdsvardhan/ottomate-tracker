server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # === SECURITY: Rule 1 — Never serve dotfiles or config files ===
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~ ^/(docs|decisions|feedback|reports|inputs|node_modules)/ {
        deny all;
        return 404;
    }
    location ~ (docker-compose|Dockerfile|\.env|CLAUDE|package\.json|package-lock|\.gitignore) {
        deny all;
        return 404;
    }

    # === SECURITY: Rule 3 — No directory listing ===
    autoindex off;

    # === SECURITY: Rule 7 — Response headers ===
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self';" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # SPA fallback — try files, then index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}

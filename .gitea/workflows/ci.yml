# .gitea/workflows/ci.yml — Ottomate app CI (canonical adr-020)
# Quality (fast gates) verified green on host 2026-07-06: `tsc --noEmit` + `next build`
# (output: standalone, all DB routes dynamic — no build-time DB needed). #57.
#
# NOTE (tests job): the Playwright E2E harness boots a disposable Ottomate via
# `docker run` (tests/e2e-run-server.sh :3100). A stock CI container has no docker
# socket, so enabling RUN_TESTS also requires either docker-in-docker for the runner
# OR pointing E2E_BASE_URL at a deployed instance. Left gated (off) until then.
name: ci
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality:                      # always hard — fast gates (adr-020)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint --if-present || echo "lint warnings (non-blocking)"
      - run: npm run build
  tests:                        # gated behind RUN_TESTS; prebuilt Playwright (no per-run download)
    if: ${{ vars.RUN_TESTS == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test --if-present
      - run: npx playwright test --if-present
